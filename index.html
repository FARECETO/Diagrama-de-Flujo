<!DOCTYPE html>
<html lang="es">
<head>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  
  <title>Scientific Flowchart Designer</title>

  <link rel="stylesheet" href="style.css"/>

  <!-- ICONOS -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <!-- LIBRERÍAS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="light">

<div class="topbar">

  <div class="brand">
    <i class="fa-solid fa-diagram-project"></i>
    Scientific Flowchart Designer
  </div>

  <div class="toolbar">
    <input type="password" id="apiKeyInput" placeholder="🔑 Pega tu Gemini API Key aquí" style="padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 13px; width: 220px;">

    <select id="fontSelector">
      <option value="Arial">Arial</option>
      <option value="Helvetica">Helvetica</option>
      <option value="Inter">Inter</option>
      <option value="Times New Roman">Times</option>
      <option value="Georgia">Georgia</option>
    </select>

    <button id="themeToggle">
      <i class="fa-solid fa-moon"></i>
    </button>

  </div>

</div>

<div class="container">

  <!-- PANEL IZQUIERDO -->
<div class="editor-panel">
  <div class="panel-title">1. Pegar Texto del Proceso</div>
  <textarea id="rawTextInput" placeholder="Ejemplo:&#10;Producción de Mermelada&#10;&#10;- Recepción de Materia Prima [derecha]&#10;Fruta: Fresa fresca&#10;Peso: 5 kg&#10;&#10;- Lavado y Selección [izquierda]&#10;Agua: Potable" style="height: 200px; flex: none; border-bottom: 1px solid var(--border);"></textarea>
  <div class="buttons" style="padding: 10px 20px; border-bottom: 1px solid var(--border); border-top: none;">
    <button id="convertTextBtn" style="background: #10b981;">⚡ Convertir a JSON</button>
  </div>

  <div class="panel-title">2. Código JSON Generado</div>
  <textarea id="jsonInput" placeholder="Aquí aparecerá el JSON automáticamente..."></textarea>

  <div class="buttons" style="flex-direction: column; gap: 8px;">
    <button id="renderBtn" style="width: 100%;">🎨 Generar Diagrama</button>

    <div style="display: flex; gap: 10px; width: 100%;">
      <button id="exportPNG" style="flex: 1; background: #475569;">🖼️ Exportar PNG</button>
      <button id="exportPDF" style="flex: 1; background: #475569;">📄 Exportar PDF</button>
    </div>
  </div>
</div>
  <!-- PANEL DERECHO -->
  <div class="preview-panel">

    <div id="diagramContainer">

      <svg id="diagramSVG"></svg>

    </div>

  </div>

</div>

<!-- MENÚ CONTEXTUAL -->
<div id="contextMenu">

  <label>
    Color relleno
    <input type="color" id="fillColorPicker"/>
  </label>

  <label>
    Color borde
    <input type="color" id="strokeColorPicker"/>
  </label>

</div>

<script type="importmap">
  {
    "imports": {
      "@google/generative-ai": "https://esm.run/@google/generative-ai"
    }
  }
</script>
<script type="module" src="script.js"></script>

</body>
</html>
